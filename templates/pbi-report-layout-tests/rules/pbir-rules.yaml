# Layout and visual rules for pbir-utils' rule engine:
#   pbir-utils validate <X.Report> --source rules --rules-config pbir-rules.yaml
# verify_report.py runs them for you, on a PBIR folder or the PBIR inside a PBIX.
#
# Expressions are simpleeval, a safe subset of Python, evaluated per report, page or visual. The engine silently skips a
# visual whose expression raises, so every read goes through get_path(...) or has_path(...) with a default, and a
# rule that cannot apply returns True. Visual groups have no "visual" key; rules let them pass.
# Calibrated with pbir-utils 2.5.2 on a 1280 x 720 report.

options:
  fail_on_warning: false

# Only these rules run (pbir-utils' own default rules are left out unless listed).
rules:
  - page_fit_to_width
  - page_canvas_background
  - page_size
  - filters_pane_collapsed
  - explicit_page_names
  - card_display_units
  - axis_display_units
  - secondary_axis_display_units
  - data_label_display_units
  - pie_labels
  - title_text_localized
  - alt_text_present

definitions:
  page_fit_to_width:
    description: "Page view is Fit to width"
    severity: error
    scope: page
    expression: >
      page.get("displayOption") == "FitToWidth"

  page_canvas_background:
    description: "Canvas background is #FAF9F8 at transparency 0"
    severity: error
    scope: page
    params:
      canvas: "'#FAF9F8'"
    expression: >
      str(get_path(page, "objects.background[0].properties.color.solid.color.expr.Literal.Value", "")).upper() == canvas
      and re_match(r"^0(\.0+)?[DL]?$", str(get_path(page, "objects.background[0].properties.transparency.expr.Literal.Value", "x")))

  page_size:
    description: "Page is 1280 x 720"
    severity: warning
    scope: page
    params:
      page_width: 1280
      page_height: 720
    expression: >
      page.get("width") == page_width and page.get("height") == page_height

  filters_pane_collapsed:
    description: "Filters pane is collapsed in report.json, still visible, and not set per page"
    severity: error
    scope: report
    expression: >
      get_path(report, "objects.outspacePane[0].properties.expanded.expr.Literal.Value", "") == "false"
      and get_path(report, "objects.outspacePane[0].properties.visible.expr.Literal.Value", "true") != "false"
      and all(not has_path(p, "objects.outspacePane[0].properties.expanded")
              and not has_path(p, "objects.outspacePane[0].properties.visible") for p in pages)

  explicit_page_names:
    description: "Pages have explicit names, not 'Page N'"
    severity: warning
    scope: page
    expression: >
      not re_match(r'^Page \d+$', page.get("displayName", ""))

  card_display_units:
    description: "Card values show full numbers (display units None)"
    severity: error
    scope: visual
    expression: >
      get_path(visual, "visual.visualType", "") != "card"
      or get_path(visual, "visual.objects.labels[0].properties.labelDisplayUnits.expr.Literal.Value", "") == "1D"

  axis_display_units:
    description: "Value axes show full numbers (display units None)"
    severity: error
    scope: visual
    params:
      axis_types: [lineChart, areaChart, stackedAreaChart, clusteredColumnChart, columnChart, clusteredBarChart,
                   barChart, lineStackedColumnComboChart, lineClusteredColumnComboChart]
    expression: >
      get_path(visual, "visual.visualType", "") not in axis_types
      or get_path(visual, "visual.objects.valueAxis[0].properties.show.expr.Literal.Value", "true") == "false"
      or get_path(visual, "visual.objects.valueAxis[0].properties.labelDisplayUnits.expr.Literal.Value", "") == "1D"

  secondary_axis_display_units:
    description: "The secondary value axis of a combo chart shows full numbers"
    severity: error
    scope: visual
    params:
      combo_types: [lineStackedColumnComboChart, lineClusteredColumnComboChart]
    expression: >
      get_path(visual, "visual.visualType", "") not in combo_types
      or not has_path(visual, "visual.query.queryState.Y2.projections[0]")
      or get_path(visual, "visual.objects.valueAxis[0].properties.secShow.expr.Literal.Value", "true") == "false"
      or get_path(visual, "visual.objects.valueAxis[0].properties.secLabelDisplayUnits.expr.Literal.Value", "") == "1D"

  data_label_display_units:
    description: "Shown data labels show full numbers"
    severity: error
    scope: visual
    expression: >
      get_path(visual, "visual.visualType", "") in ["card", "donutChart", "pieChart"]
      or get_path(visual, "visual.objects.labels[0].properties.show.expr.Literal.Value", "false") != "true"
      or get_path(visual, "visual.objects.labels[0].properties.labelDisplayUnits.expr.Literal.Value", "") == "1D"

  pie_labels:
    description: "Donut and pie labels show full numbers and one-decimal percentages"
    severity: error
    scope: visual
    expression: >
      get_path(visual, "visual.visualType", "") not in ["donutChart", "pieChart"]
      or get_path(visual, "visual.objects.labels[0].properties.show.expr.Literal.Value", "true") == "false"
      or (get_path(visual, "visual.objects.labels[0].properties.labelDisplayUnits.expr.Literal.Value", "") == "1D"
          and get_path(visual, "visual.objects.labels[0].properties.percentageLabelPrecision.expr.Literal.Value", "") == "1D")

  title_text_localized:
    description: "Shown titles and subtitles are bound to report text (localization constants), not literal text"
    severity: warning
    scope: visual
    params:
      title_off_types: [actionButton, shape, basicShape, image, textbox, slicer, advancedSlicerVisual, pageNavigator,
                        bookmarkNavigator]
    expression: >
      all(not has_path(visual, "visual.visualContainerObjects." + o + "[0].properties.text.expr.Literal")
          or get_path(visual, "visual.visualContainerObjects." + o + "[0].properties.show.expr.Literal.Value", "unset") == "false"
          or (get_path(visual, "visual.visualContainerObjects." + o + "[0].properties.show.expr.Literal.Value", "unset") == "unset"
              and (o == "subTitle" or get_path(visual, "visual.visualType", "") in title_off_types))
          for o in ["title", "subTitle"])

  alt_text_present:
    description: "Every shown data visual has alt text"
    severity: warning
    scope: visual
    params:
      decorative_types: [textbox, shape, basicShape, image, actionButton, slicer, advancedSlicerVisual, pageNavigator,
                         bookmarkNavigator]
    expression: >
      not has_path(visual, "visual.visualType")
      or get_path(visual, "visual.visualType", "") in decorative_types
      or visual.get("isHidden", False)
      or has_path(visual, "visual.visualContainerObjects.general[0].properties.altText")
